# Optional: containerized MySQL for machines without XAMPP.
# Local development normally uses XAMPP's MySQL/MariaDB on 127.0.0.1:3306
# (see backend/.env.example). This compose file maps to host port 3307 so the
# two can coexist.
services:
  db:
    image: mariadb:10.6
    container_name: onboarding-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: employee_onboarding
    ports:
      - "3307:3306"
    volumes:
      - onboarding_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queues + refresh-token revocation (backend/.env: REDIS_URL=redis://127.0.0.1:6379).
  # Optional in development — without it the app sends email inline and runs
  # the SLA timer in-process, exactly as before.
  redis:
    image: redis:7-alpine
    container_name: onboarding-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - onboarding_redis:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  onboarding_mysql:
  onboarding_redis:
