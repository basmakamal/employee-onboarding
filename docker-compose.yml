services:
  db:
    image: postgres:16-alpine
    container_name: onboarding-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding
    ports:
      - "5433:5432"
    volumes:
      - onboarding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  onboarding_pgdata:
